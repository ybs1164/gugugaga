<!doctype html>
<!-- 전투 HUD 픽셀 리디자인 시안. 계획: docs/HudPixelRedesignPlan.md. ?v=mobile | ?v=pc -->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>HUD Mockup</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.39.3/dist/galmuri.css">
<style>
@font-face { font-family: 'Jua'; src: url('../../../Assets/Fonts/Jua-Regular.ttf'); }
:root {
  --ink: #0c080a;
  --base: #1b1d23;
  --raised: #2d3038;
  --muted: #7f848e;
  --paper: #ece5d8;
  --accent: #f0a53a;
  --accent-dark: #a8661c;
  --t: 2px; /* 1 texel */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  background: #1f2a3a;
  color: var(--paper);
  font-family: 'Galmuri11', 'Jua', sans-serif;
  font-size: 12px;
  -webkit-font-smoothing: none;
  font-smooth: never;
}
.screen { position: relative; overflow: hidden; }
.map {
  position: absolute; left: 50%; top: 50%;
  image-rendering: pixelated;
  transform: translate(-50%, -50%);
}
/* 9-slice 틀 흉내: 1텍셀 외곽선 + 모서리 1텍셀 깎기 + 위 밝은 베벨 / 아래 어두운 베벨 */
.frame {
  background: var(--raised);
  border: var(--t) solid var(--ink);
  clip-path: polygon(var(--t) 0, calc(100% - var(--t)) 0, 100% var(--t), 100% calc(100% - var(--t)),
    calc(100% - var(--t)) 100%, var(--t) 100%, 0 calc(100% - var(--t)), 0 var(--t));
  box-shadow: inset 0 var(--t) 0 rgba(255,255,255,0.10), inset 0 calc(var(--t) * -2) 0 rgba(0,0,0,0.35);
  position: relative;
}
.frame.base { background: var(--base); }
.frame.hover { outline: none; box-shadow: inset 0 0 0 var(--t) var(--paper), inset 0 calc(var(--t) * -3) 0 rgba(0,0,0,0.35); }
.frame.accent-line { box-shadow: inset 0 0 0 var(--t) var(--accent), inset 0 calc(var(--t) * -3) 0 rgba(0,0,0,0.35); }
.frame.accent-fill { background: var(--accent); color: var(--ink);
  box-shadow: inset 0 var(--t) 0 rgba(255,255,255,0.35), inset 0 calc(var(--t) * -2) 0 var(--accent-dark); }
canvas.icon { image-rendering: pixelated; display: block; flex: none; }

.topbar {
  position: absolute; left: 0; right: 0; top: 0;
  background: var(--base);
  border-bottom: var(--t) solid var(--ink);
  box-shadow: 0 var(--t) 0 rgba(0,0,0,0.35);
  display: flex; align-items: center; gap: 6px; padding: 0 8px;
}
.chip { display: flex; align-items: center; gap: 4px; height: 36px; padding: 0 8px 0 4px; }
.chip .val { font-size: 12px; letter-spacing: 0; white-space: nowrap; }
.chip .val .max { color: var(--muted); }
.chip .gauge { position: absolute; left: 6px; right: 6px; bottom: 4px; height: var(--t); background: var(--ink); }
.chip .gauge i { display: block; height: 100%; background: var(--paper); }
.spacer { flex: 1; }
.iconbtn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }

.key {
  position: absolute; right: 3px; bottom: 3px;
  font-size: 12px; line-height: 12px; color: var(--muted);
  padding: 1px 3px; background: rgba(12,8,10,0.55);
}
.endturn:has(.key) { justify-content: flex-start; padding-left: 10px; }
.accent-fill .key { color: var(--ink); background: rgba(12,8,10,0.12); }

.actionrow { position: absolute; display: flex; gap: 8px; align-items: stretch; }
.act { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.act .lbl { font-size: 12px; color: var(--muted); }
.act.endturn { flex: 1; flex-direction: row; gap: 8px; }
.endturn .txt { display: flex; flex-direction: column; gap: 3px; }
.endturn .big { font-size: 24px; line-height: 24px; font-family: 'Galmuri11', 'Jua', sans-serif; }
.endturn .sub { font-size: 12px; }
.badge-dot { position: absolute; right: 6px; top: 6px; width: 6px; height: 6px; background: var(--paper); box-shadow: 0 0 0 var(--t) var(--ink); }

.punch { position: absolute; display: flex; flex-direction: column; gap: 6px; padding: 8px; }
.punch .head { display: flex; justify-content: space-between; align-items: center; padding: 0 2px 2px; }
.punch .head b { font-weight: normal; font-size: 12px; }
.card { display: flex; gap: 8px; padding: 6px 8px 8px 6px; align-items: center; }
.card .tile { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: var(--base); box-shadow: 0 0 0 var(--t) var(--ink); flex: none; }
.card .body { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.card .row1 { display: flex; justify-content: space-between; align-items: center; }
.card .cost { display: flex; align-items: center; gap: 2px; }
.card .desc { color: var(--muted); }
.card.off { color: var(--muted); background: var(--base); }
.card.off .cost span { text-decoration: line-through; text-decoration-thickness: 2px; }
.notch { position: absolute; bottom: -8px; width: 12px; height: 8px; background: var(--ink);
  clip-path: polygon(0 0, 100% 0, 50% 100%); }

.toast { position: absolute; display: flex; flex-direction: column; gap: 4px; }
.toast div { background: rgba(12,8,10,0.72); padding: 4px 8px; color: var(--paper); }
.toast div.old { color: var(--muted); }

.panel { position: absolute; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.panel .title { display: flex; justify-content: space-between; align-items: flex-start; }
.panel .name { font-size: 24px; line-height: 24px; }
.panel .sub { color: var(--muted); }
.hp { display: flex; align-items: center; gap: 6px; }
.hp .bar { flex: 1; height: 8px; background: var(--ink); padding: var(--t); }
.hp .bar i { display: block; height: 100%; background: var(--paper); }
.stats { display: flex; gap: 12px; }
.stats span { display: flex; align-items: center; gap: 3px; }
.sep { height: var(--t); background: var(--ink); margin: 2px 0; }
.opt { display: flex; flex-direction: column; gap: 3px; padding: 6px 8px 8px; }
.opt .d { color: var(--muted); }
.opt.off { background: var(--base); color: var(--muted); }

.tip { position: absolute; padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; background: var(--ink); color: var(--paper); }
.tip .d { color: var(--muted); }
.tip::before { content: ''; position: absolute; top: -6px; left: var(--notch, 18px); width: 10px; height: 6px; background: var(--ink); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.cursor { position: absolute; }
</style>
</head>
<body>
<div class="screen" id="screen"></div>
<script>
// ── 12x12 아이콘: '#' = 칠(토큰색), 'd' = 잉크 디테일. 외곽선은 칠 주변 빈칸에 자동으로 1텍셀.
const N = 12;
const grid = () => Array.from({ length: N }, () => Array(N).fill('.'));
const fromRows = rows => { const g = grid(); rows.forEach((r, y) => [...r].forEach((c, x) => { if (x < N && y < N) g[y][x] = c; })); return g; };
const fn = f => { const g = grid(); for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) g[y][x] = f(x + 0.5, y + 0.5) || '.'; return g; };
const C = 6;
const r = (x, y) => Math.hypot(x - C, y - C);
const ang = (x, y) => Math.atan2(y - C, x - C) * 180 / Math.PI;

const ICONS = {
  crown: fromRows([
    '............',
    '#....##....#',
    '##..####..##',
    '###.####.###',
    '############',
    '############',
    '#d##d##d##d#',
    '############',
    '.##########.',
    '............',
    '............',
    '............',
  ]),
  flame: fromRows([
    '.....#......',
    '.....##.....',
    '....###.....',
    '....####....',
    '...#####.#..',
    '..########..',
    '..###d####..',
    '.###dd#####.',
    '.###ddd####.',
    '.####dd####.',
    '..########..',
    '...######...',
  ]),
  coins: fn((x, y) => {
    for (const cy of [2.5, 6, 9.5]) {
      const e = ((x - C) / 5.5) ** 2 + ((y - cy) / 2.2) ** 2;
      if (e <= 1) return (cy !== 9.5 && y > cy + 1.2) ? 'd' : '#';
    }
  }),
  turn: fn((x, y) => {
    const d = r(x, y), a = ang(x, y);
    if (x > 7.5 && x < 11.6 && y > 0.5 && y < 6 && (x - 7.5) + (5.8 - y) < 4.6 && (x - 7.5) > (y - 1.5) * 0.0) {
      // 화살촉: 오른쪽 위 끝에서 아래로
      if (y > 2 && (x - 9.5) ** 2 / 4 + 0 < 1 && Math.abs(x - 9.5) <= (y - 1.5)) return '#';
    }
    if (d >= 3.4 && d <= 5.6 && !(a > -80 && a < -20)) return '#';
  }),
  gear: fn((x, y) => {
    const d = r(x, y), a = ((ang(x, y) % 45) + 45) % 45;
    if (d < 1.7) return;
    if (d <= 4.2) return '#';
    if (d <= 5.9 && (a < 11 || a > 34)) return '#';
  }),
  info: fn((x, y) => {
    if (r(x, y) > 5.8) return;
    const cx = x >= 5 && x <= 7;
    if (cx && y >= 2 && y < 4) return 'd';
    if (cx && y >= 5 && y < 10) return 'd';
    return '#';
  }),
  fist: fromRows([
    '............',
    '..##.##.##..',
    '.##########.',
    '.##########.',
    '.#d##d##d##.',
    '.##########.',
    '###########.',
    '####d######.',
    '###d#######.',
    '.##########.',
    '..#########.',
    '...#######..',
  ]),
  tree: fn((x, y) => {
    const nodes = [[6, 2], [2.5, 9.5], [9.5, 9.5]];
    for (const [nx, ny] of nodes) if (Math.hypot(x - nx, y - ny) <= 2.1) return '#';
    if (y > 2 && y < 6 && x >= 5 && x <= 7) return '#';
    if (y >= 5 && y < 6.5 && x >= 2 && x <= 10) return '#';
    if (y >= 5 && y < 8 && ((x >= 2 && x <= 3) || (x >= 9 && x <= 10))) return '#';
  }),
  ff: fn((x, y) => {
    const lx = x < 6 ? x : x - 6;
    if (y < 1 || y > 11) return;
    return Math.abs(y - C) <= (6 - lx) * 0.95 ? '#' : undefined;
  }),
  flag: fromRows([
    '..##........',
    '..########..',
    '..#########.',
    '..########..',
    '..#######...',
    '..########..',
    '..#########.',
    '..##........',
    '..##........',
    '..##........',
    '..##........',
    '.####.......',
  ]),
  hourglass: fromRows([
    '############',
    '.##########.',
    '..########..',
    '...######...',
    '....####....',
    '.....##.....',
    '.....##.....',
    '....#dd#....',
    '...#dddd#...',
    '..#dddddd#..',
    '.##########.',
    '############',
  ]),
  heart: fromRows([
    '............',
    '.###...###..',
    '#####.#####.',
    '###########.',
    '###########.',
    '.#########..',
    '..#######...',
    '...#####....',
    '....###.....',
    '.....#......',
    '............',
    '............',
  ]),
  sword: fromRows([
    '..........##',
    '.........###',
    '........###.',
    '.......###..',
    '......###...',
    '.#...###....',
    '.##.###.....',
    '..####......',
    '...##.......',
    '..####......',
    '.##..##.....',
    '##..........',
  ]),
  shield: fromRows([
    '.##########.',
    '.##########.',
    '.####dd####.',
    '.####dd####.',
    '.##dddddd##.',
    '.####dd####.',
    '..###dd###..',
    '..########..',
    '...######...',
    '....####....',
    '.....##.....',
    '............',
  ]),
  move: fromRows([
    '.....##.....',
    '....####....',
    '...######...',
    '..########..',
    '.##########.',
    '....####....',
    '....####....',
    '....####....',
    '....####....',
    '....####....',
    '............',
    '............',
  ]),
  range: fn((x, y) => {
    const d = r(x, y);
    if (d <= 1.6) return '#';
    if (d >= 3.2 && d <= 4.3) return '#';
    if (d >= 5.3 && d <= 6.2) return '#';
  }),
  cursor: fromRows([
    '#...........',
    '##..........',
    '###.........',
    '####........',
    '#####.......',
    '######......',
    '#######.....',
    '####........',
    '##.##.......',
    '#..##.......',
    '....##......',
    '....##......',
  ]),
};

const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
function icon(name, color = 'paper', scale = 2) {
  const g = ICONS[name], S = N + 2;
  const cv = document.createElement('canvas');
  cv.width = S; cv.height = S; cv.className = 'icon';
  cv.style.width = cv.style.height = (S * scale) + 'px';
  const ctx = cv.getContext('2d');
  const fill = css('--' + color), ink = css('--ink');
  const at = (x, y) => (x >= 0 && y >= 0 && x < N && y < N) ? g[y][x] : '.';
  for (let y = -1; y <= N; y++) for (let x = -1; x <= N; x++) {
    const c = at(x, y);
    let col = null;
    if (c === '#') col = fill;
    else if (c === 'd') col = ink;
    else if ([[1,0],[-1,0],[0,1],[0,-1]].some(([dx, dy]) => at(x + dx, y + dy) !== '.')) col = ink;
    if (col) { ctx.fillStyle = col; ctx.fillRect(x + 1, y + 1, 1, 1); }
  }
  return cv;
}

// ── 조립 도우미
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const put = (parent, ...kids) => { kids.forEach(k => parent.appendChild(k)); return parent; };
const box = (el, s) => { Object.assign(el.style, s); return el; };

function chip({ ic, icColor, val, max, gauge, cls = '', width }) {
  const c = h('div', 'frame chip ' + cls);
  if (width) c.style.width = width + 'px';
  put(c, icon(ic, icColor || 'paper'));
  c.appendChild(h('span', 'val', max != null ? `${val}<span class="max">/${max}</span>` : String(val)));
  if (gauge != null) put(c, put(h('div', 'gauge'), box(h('i'), { width: gauge + '%' })));
  return c;
}
const key = k => h('span', 'key', k);

function topbar(o) {
  const bar = box(h('div', 'topbar'), { height: o.height + 'px', paddingTop: (o.safeTop || 0) + 'px' });
  const w = o.chipWidth;
  put(bar,
    chip({ ic: 'crown', icColor: o.rank === 1 ? 'accent' : 'paper', val: o.rank, max: 4, width: w[0] }),
    chip({ ic: 'flame', val: 120, max: 200, gauge: 60, width: w[1], cls: o.faithHover ? 'hover' : '' }),
    chip({ ic: 'coins', val: 87, width: w[2] }),
    chip({ ic: 'turn', val: 3, max: o.turnLimit, width: w[3] }),
    h('div', 'spacer'));
  const menu = put(h('div', 'frame iconbtn'), icon('gear'));
  if (o.keys) menu.appendChild(box(key('Esc'), { right: 'auto', left: '-2px', bottom: '-2px', display: 'none' }));
  bar.appendChild(menu);
  return bar;
}

function actionRow(o) {
  const row = box(h('div', 'actionrow'), o.pos);
  const sq = o.square;
  const mk = (ic, lbl, k, extra = '', color = 'paper') => {
    const b = box(h('div', 'frame act ' + extra), { width: sq + 'px', height: o.height + 'px' });
    put(b, icon(ic, color));
    if (lbl) b.appendChild(h('span', 'lbl', lbl));
    if (o.keys && k) b.appendChild(key(k));
    return b;
  };
  const info = mk('info', o.labels ? '정보' : '', 'I', o.infoOpen ? 'hover' : '');
  const punch = mk('fist', o.labels ? '펀치' : '', 'F', 'accent-line');
  const tech = mk('tree', o.labels ? '기술' : '', 'T');
  tech.appendChild(h('span', 'badge-dot'));
  const end = box(h('div', 'frame act endturn ' + (o.endState === 'noaction' ? 'accent-fill' : '')), { height: o.height + 'px' });
  const endColor = o.endState === 'noaction' ? 'ink' : 'paper';
  put(end, icon('ff', endColor));
  const txt = h('div', 'txt');
  txt.appendChild(h('span', 'big', '턴 종료'));
  txt.appendChild(box(h('span', 'sub', o.endState === 'noaction' ? '할 행동 없음' : '남은 행동 2'),
    { color: o.endState === 'noaction' ? 'var(--ink)' : 'var(--muted)' }));
  end.appendChild(txt);
  if (o.keys) end.appendChild(key('Space'));
  put(row, info, punch, tech, end);
  return { row, punch };
}

function punchList(o) {
  const p = box(h('div', 'frame base punch'), o.pos);
  const head = h('div', 'head');
  head.appendChild(h('b', '', '신앙 펀치'));
  const have = h('span', 'cost'); have.style.display = 'flex'; have.style.alignItems = 'center'; have.style.gap = '2px';
  put(have, icon('flame', 'paper', 1)); have.appendChild(h('span', '', '보유 120'));
  head.appendChild(have);
  p.appendChild(head);
  const cards = [
    ['flame', '불씨 낙하', 40, '고른 칸의 적에게 피해 3', true],
    ['shield', '수호의 빛', 80, '아군 하나 이번 턴 방어 +2', true],
    ['crown', '신의 강림', 160, '신화 유닛 하나를 부른다', false],
  ];
  for (const [ic, name, cost, desc, on] of cards) {
    const c = h('div', 'frame card' + (on ? '' : ' off'));
    put(c, put(h('div', 'tile'), icon(ic, on ? 'paper' : 'muted')));
    const body = h('div', 'body');
    const r1 = h('div', 'row1');
    r1.appendChild(h('span', '', name));
    const cs = h('span', 'cost'); put(cs, icon('flame', on ? 'paper' : 'muted', 1)); cs.appendChild(h('span', '', String(cost)));
    r1.appendChild(cs);
    body.appendChild(r1);
    body.appendChild(h('span', 'desc', desc));
    c.appendChild(body);
    p.appendChild(c);
  }
  if (o.notchX != null) p.appendChild(box(h('div', 'notch'), { left: o.notchX + 'px' }));
  return p;
}

function toast(pos, lines) {
  const t = box(h('div', 'toast'), pos);
  lines.forEach((l, i) => t.appendChild(h('div', i ? 'old' : '', l)));
  return t;
}

function unitPanel(pos) {
  const p = box(h('div', 'frame base panel'), pos);
  const t = h('div', 'title');
  const n = h('div'); n.appendChild(h('div', 'name', '방패병')); n.appendChild(box(h('div', 'sub', '아군 · 베테랑 1/3'), { marginTop: '6px' }));
  t.appendChild(n);
  t.appendChild(box(h('div', 'frame iconbtn', 'X'), { width: '28px', height: '28px' }));
  p.appendChild(t);
  const hp = h('div', 'hp'); put(hp, icon('heart')); hp.appendChild(h('span', '', '15/15'));
  put(hp, put(h('div', 'bar'), box(h('i'), { width: '100%' })));
  p.appendChild(hp);
  const st = h('div', 'stats');
  for (const [ic, v] of [['sword', 1], ['shield', 3], ['move', 2], ['range', 1]]) { const s = h('span'); put(s, icon(ic)); s.appendChild(h('span', '', String(v))); st.appendChild(s); }
  p.appendChild(st);
  p.appendChild(h('div', 'sep'));
  const opts = [
    ['방어 태세', '받는 피해를 줄인다 (방어 +1)', true],
    ['대기', '이번 턴을 마치고 체력을 회복한다', true],
    ['치유', '체력이 가득해서 쓸 수 없다', false],
  ];
  for (const [a, d, on] of opts) {
    const o = h('div', 'frame opt' + (on ? '' : ' off'));
    o.appendChild(h('span', '', a)); o.appendChild(h('span', 'd', d));
    p.appendChild(o);
  }
  return p;
}

function map(scale) {
  const m = h('img', 'map'); m.src = 'map.png';
  m.style.width = m.style.height = (768 * scale) + 'px';
  return m;
}

// ── 두 판
const v = new URLSearchParams(location.search).get('v') || 'mobile';
const screen = document.getElementById('screen');
const [SW, SH] = v === 'mobile' ? [430, 932] : [1280, 720]; // 논리 화면(UI 단위)
box(screen, { width: SW + 'px', height: SH + 'px' });
document.body.style.zoom = 2; // 1 UI 단위 = 2 화면 픽셀로 캡처

if (v === 'mobile') {
  // 휴대폰 세로(좁은 배치) · 터치 · 신앙 펀치를 연 상태 · 할 행동 없음
  const W = SW, pad = 12, rowH = 64, sq = 56;
  screen.appendChild(map(0.5));
  const chipW = Math.floor((W - 16 - 36 - 6 * 4) / 4);
  screen.appendChild(topbar({ height: 52, rank: 2, chipWidth: [chipW - 14, chipW + 14, chipW - 8, chipW + 8], turnLimit: 30 }));
  screen.appendChild(toast({ left: '8px', top: '60px' }, ['궁수가 전사를 공격 -4', '도시 레벨 2']));
  const { row } = actionRow({ pos: { left: pad + 'px', right: pad + 'px', bottom: pad + 'px' }, height: rowH, square: sq, labels: true, endState: 'noaction' });
  screen.appendChild(row);
  const punchX = pad + sq + 8;
  screen.appendChild(punchList({ pos: { left: pad + 'px', right: pad + 'px', bottom: (pad + rowH + 12) + 'px' }, notchX: punchX - pad + sq / 2 + 4 - 6 }));
} else {
  // PC(넓은 배치) · 키보드·마우스 · 유닛 정보 열림 · 신앙 칩에 마우스 · 행동 남음
  const colW = 360, pad = 12, rowH = 56, sq = 56;
  screen.appendChild(map(2 / 3));
  screen.appendChild(topbar({ height: 48, rank: 1, keys: true, faithHover: true, chipWidth: [84, 118, 76, 64] }));
  screen.appendChild(toast({ left: '8px', top: '200px' }, ['궁수가 전사를 공격 -4', '도시 레벨 2']));
  const { row } = actionRow({ pos: { right: pad + 'px', bottom: pad + 'px', width: colW + 'px' }, height: rowH, square: sq, labels: false, keys: true, infoOpen: true, endState: 'left' });
  screen.appendChild(row);
  screen.appendChild(unitPanel({ right: pad + 'px', top: '60px', width: colW + 'px' }));
  const tip = box(h('div', 'tip'), { left: '98px', top: '54px', width: '250px' });
  tip.style.setProperty('--notch', '54px');
  tip.appendChild(h('span', '', '신앙 120 / 최대 200'));
  tip.appendChild(h('span', 'd', '다음 턴 +3 (순위 1위 보너스 포함)'));
  tip.appendChild(h('span', 'd', '최대치에 닿으면 더 쌓이지 않는다'));
  screen.appendChild(tip);
  const cur = icon('cursor', 'paper', 2); cur.classList.add('cursor'); box(cur, { left: '170px', top: '24px' });
  screen.appendChild(cur);
  // 단축키: 메뉴 Esc
  const menu = screen.querySelector('.topbar .iconbtn');
  const esc = key('Esc'); box(esc, { position: 'absolute', right: '48px', top: '17px' });
  screen.querySelector('.topbar').appendChild(esc);
}
</script>
